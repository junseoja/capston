# ============================================================
# Routine Mate — Docker Compose 정의
# ============================================================
# 3개 서비스를 하나의 네트워크에 묶어 한 번에 띄움.
#
# 실행:
#   docker compose up           # 포그라운드, 로그 그대로 보임
#   docker compose up -d        # 백그라운드(detach)
#   docker compose up --build   # 코드/Dockerfile 변경 후 강제 재빌드
#   docker compose down         # 모든 컨테이너 정리
#   docker compose logs -f      # 실행 중 로그 추적
#
# 외부 의존성 (이미지에 들어가지 않음, 인터넷 통해 직접 접속):
#   - AWS RDS MySQL (ap-northeast-2)
#   - AWS S3 버킷
#
# 핫 리로드:
#   - 호스트의 ./src 폴더를 컨테이너의 /app/src 에 마운트
#   - 코드 수정 → Vite/node --watch/uvicorn --reload 가 자동 감지 → 즉시 반영
#   - 따라서 팀원은 평소 IDE 로 코드 수정만 하면 됨
#
# 컨테이너 간 통신:
#   - 같은 docker compose 네트워크 안 → 서비스명을 호스트로 사용
#   - 예: backend 가 python_api 부를 때 http://python_api:8000
#   - 단, 브라우저 → backend 통신은 여전히 http://localhost:3000
#     (브라우저는 컨테이너 밖이라 호스트 포트 매핑을 통해 접근)
# ============================================================

services:
  # ─── React 프론트엔드 (Vite dev server) ────────────────────────────────────
  frontend:
    build:
      context: .                     # 빌드 컨텍스트 = 프로젝트 루트
      dockerfile: Dockerfile.frontend
    container_name: routine_mate_frontend
    ports:
      # 호스트:컨테이너 — 브라우저는 http://localhost:5173 으로 접근
      - "5173:5173"
    volumes:
      # 호스트 코드 → 컨테이너 동기화 (핫 리로드)
      - .:/app
      # 컨테이너 안 node_modules 는 호스트에 노출되지 않도록 named volume 으로 격리
      # (호스트 OS 차이 때문에 npm install 한 native 모듈이 안 도는 문제 차단)
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env                         # VITE_EXPRESS_URL 등
    depends_on:
      - backend
    # Vite 의 파일 변경 감지를 macOS/Windows 에서 안정화
    environment:
      - CHOKIDAR_USEPOLLING=true

  # ─── Express 백엔드 (인증/세션/파일업로드 허브) ────────────────────────────
  backend:
    build:
      context: ./src/backend         # 빌드 컨텍스트 = src/backend
      dockerfile: ../../Dockerfile.backend
    container_name: routine_mate_backend
    ports:
      - "3000:3000"
    volumes:
      - ./src/backend:/app
      - backend_node_modules:/app/node_modules
    env_file:
      - ./src/backend/.env           # PORT, AWS_*, FRONTEND_URL 등
    environment:
      # ⚠️ 중요: 컨테이너 안 통신은 서비스명 사용
      # .env 의 PYTHON_API=http://localhost:8000 을 덮어씀
      - PYTHON_API=http://python_api:8000
      # 프론트는 호스트 포트로 접근하므로 그대로
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      - python_api

  # ─── FastAPI Python (DB CRUD 계층) ─────────────────────────────────────────
  python_api:
    build:
      context: ./src/python_api      # 빌드 컨텍스트 = src/python_api
      dockerfile: ../../Dockerfile.python_api
    container_name: routine_mate_python_api
    ports:
      - "8000:8000"
    volumes:
      - ./src/python_api:/app
      # python 은 venv/site-packages 를 /usr/local/lib 에 두므로 별도 named volume 불필요
    env_file:
      - ./src/python_api/.env        # DB_HOST, DB_USER 등 RDS 자격증명
    environment:
      # [추가 2026-05-17] uvicorn --reload 가 macOS/Windows 도커 볼륨에서
      # 파일 변경을 못 잡는 문제(inotify 가 볼륨 경계 못 넘음) 해결.
      # watchfiles 를 polling 모드로 강제 → 호스트 코드 수정 시 자동 재시작.
      # (frontend 의 CHOKIDAR_USEPOLLING=true 와 같은 목적)
      - WATCHFILES_FORCE_POLLING=true

# ── Named Volumes ────────────────────────────────────────────────────────────
# 컨테이너 재기동·rebuild 시에도 node_modules 가 살아남아 npm install 시간 절약.
# 의존성 변경 시: docker compose down -v 로 볼륨까지 정리한 뒤 up --build
volumes:
  frontend_node_modules:
  backend_node_modules:
